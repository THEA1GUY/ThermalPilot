name: Build

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main, 'codex/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: dashboard/package-lock.json
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json
    - name: Build
      run: |
        ./scripts/Build-Baseline.ps1
    - name: Real Windows telemetry, persistence and bridge reconnect
      run: ./scripts/Build-Hub.ps1
